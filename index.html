<!DOCTYPE html>
<html>
<head>
    <title>یادآور مرور دروس</title>

    <meta charset="utf-8">
</head>
<body>
    <div class="container">
        <h1>📚 یادآور مرور دروس</h1>

        <div id="remindersList">
            <h2>یادآوریهای ثبت شده:</h2>
            <ul id="reminders"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
